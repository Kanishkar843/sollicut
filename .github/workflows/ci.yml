name: SolliCut CI

on:
  push:
    branches: [KANISHDEV, main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install system media dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg libraqm0 fonts-dejavu-core espeak-ng
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.in
      - name: Generate local demo assets & verify raqm
        run: |
          python scripts/generate_demo_assets.py
          python -c "from PIL import features; assert features.check_feature('raqm')"
      - name: Run backend pytest suite
        run: python -m pytest tests/backend -q

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install, test, and build frontend
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build
