services:
  sollicut:
    build:
      context: .
      args:
        SOLLICUT_ASR_MODEL: ${SOLLICUT_ASR_MODEL:-base}
    ports:
      - "127.0.0.1:${SOLLICUT_PORT:-8080}:8080"
    volumes:
      - sollicut_data:/data
    environment:
      SOLLICUT_DATA_DIR: /data
    init: true
    restart: unless-stopped
    stop_grace_period: 3m
volumes:
  sollicut_data:
